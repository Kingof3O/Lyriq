<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:radial-gradient(circle at 30% 20%,#283041,#171922 38%,#0b0c10 78%)}.app{background:transparent}.desktop-note{position:absolute;left:38px;top:32px;font-size:12px;color:#a0a3ad}.island{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:680px;height:118px;background:#0c0c10;border:1px solid rgba(255,255,255,.09);border-radius:28px;box-shadow:0 24px 80px rgba(0,0,0,.48);display:grid;grid-template-columns:190px 1fr 140px;align-items:center;padding:0 18px;overflow:hidden}.meta{display:flex;align-items:center;gap:10px}.meta .art{width:46px;height:46px;border-radius:10px}.lyric{padding-left:16px;position:relative}.lyric:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:3px;background:var(--brand)}.l1{font-size:17px;font-weight:650}.l2{font-size:12px;color:var(--brand2);margin-top:5px}.mini-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}.mini-actions .play{width:34px;height:34px}.edge{position:absolute;left:0;right:0;bottom:0;height:2px;background:#202027}.edge:after{content:"";display:block;width:57%;height:100%;background:linear-gradient(90deg,var(--brand),var(--live))}.hint{position:absolute;left:50%;top:calc(50% + 90px);transform:translateX(-50%);font-size:11px;color:#6d7079}
</style></head><body><div class="app"><div class="desktop-note">MINI ISLAND · always-on-top · drag from empty surface</div><div class="island"><div class="meta"><div class="art"></div><div><div class="tracktitle">Midnight Language</div><div class="artist">Aurora Days</div></div></div><div class="lyric"><div class="l1">I keep your voice between the stations</div><div class="l2">駅と駅のあいだに、君の声を残してる</div></div><div class="mini-actions"><span class="iconbtn">⌖</span><span>◀</span><span class="play">Ⅱ</span><span>▶</span><span class="iconbtn">×</span></div><div class="edge"></div></div><div class="hint">Hover reveals controls · leave idle 2s to fade controls · Ctrl+Shift+M returns to Reader</div></div></body></html>
